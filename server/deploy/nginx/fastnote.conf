# FastNote relay — nginx site config
#
# This is a STANDALONE server block for FastNote only. It does not touch or
# depend on any other site config on this host — drop it in alongside your
# existing apps' config files (see docs/DEPLOYMENT.md for exact steps) and
# reload nginx. Every other `server { ... }` block on this machine is
# selected by its own `server_name` and is completely unaffected.
#
# Before use, replace:
#   fastnote.example.com   -> your real domain/subdomain
#   /var/www/certbot       -> your shared ACME webroot (reuse the one your
#                              other apps already use, if you have one)

# 1) Plain HTTP: only serves ACME challenge files for certbot renewal,
#    redirects everything else to HTTPS. Safe to coexist with other apps'
#    :80 server blocks since nginx dispatches by server_name.
server {
    listen 80;
    listen [::]:80;
    server_name fastnote.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) HTTPS: terminates TLS, reverse-proxies to the relay container which
#    only listens on 127.0.0.1:8787 (see server/docker-compose.yml).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fastnote.example.com;

    ssl_certificate     /etc/letsencrypt/live/fastnote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fastnote.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:FastNoteSSL:10m;
    ssl_session_timeout 1d;

    # Attachments can be sizable; keep in sync with the relay's own
    # 32MB WebSocket maxPayload (server/src/index.ts).
    client_max_body_size 40m;

    # Plain REST endpoints (register/login/sync/keys/messages/health).
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket chat channel needs the Upgrade/Connection headers and a
    # long read timeout so idle-but-open chat sessions aren't dropped.
    location /ws/v1 {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
