<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy bootstrap — same mechanism as apps/web/index.html: a <meta> CSP is
      applied exactly once at parse time, so it must be written synchronously via document.write
      before any resource-loading tag. Inside the Capacitor WebView the app origin is
      https://localhost ('self'); connect-src additionally allows api.anthropic.com for the AI
      Workbench plus the user's configured FastNote server (chat login + message WebSocket),
      read from the same `fastnote_server_url` localStorage key packages/api uses.
    -->
    <script>
      (function () {
        function originsForServerUrl(serverUrl) {
          try {
            var u = new URL(serverUrl);
            var httpOrigin = u.protocol + '//' + u.host;
            var wsProtocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
            var wsOrigin = wsProtocol + '//' + u.host;
            return [httpOrigin, wsOrigin];
          } catch (e) {
            return [];
          }
        }
        var serverUrl = 'http://localhost:8787';
        try {
          serverUrl = window.localStorage.getItem('fastnote_server_url') || serverUrl;
        } catch (e) {
          // localStorage unavailable — fall back to the default.
        }
        window.__FASTNOTE_CSP_SERVER_URL__ = serverUrl;
        var connectSrc = ["'self'"]
          .concat(originsForServerUrl(serverUrl))
          .concat(['https://api.anthropic.com'])
          .join(' ');
        var policy = [
          "default-src 'self'",
          "script-src 'self'",
          "style-src 'self' 'unsafe-inline'",
          "img-src 'self' data: blob:",
          "font-src 'self' data:",
          "media-src 'self' blob:",
          'connect-src ' + connectSrc,
          "object-src 'none'",
          "base-uri 'self'",
          "form-action 'none'",
        ].join('; ');
        document.write('<meta http-equiv="Content-Security-Policy" content="' + policy + '">');
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>FastNote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
